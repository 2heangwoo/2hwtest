<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mobile AR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    .card {
      width: min(92vw, 560px);
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 34px rgba(0,0,0,.10);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { line-height: 1.6; margin: 8px 0 18px; }
    a[rel="ar"] { display:block; }
    a[rel="ar"] img {
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
    }
    .note {
      margin-top: 18px;
      font-size: 14px;
      color:#666;
    }
    .download {
      display:inline-block;
      margin-top:12px;
      font-size:14px;
      color:#333;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mobile AR</h1>
    <p>iPhone 또는 iPad의 Safari에서 아래 버튼을 누르면 AR Quick Look이 실행됩니다.</p>

    <a rel="ar" href="1234.usdz">
      <img src="ar_button.png" alt="AR로 보기">
    </a>

    <p class="note">
      AR이 실행되지 않고 파일 내용이 보이면 Safari에서 이 페이지를 열었는지 확인하고,
      GitHub Pages에서 <b>index.html</b>과 <b>1234.usdz</b>가 같은 폴더에 있는지 확인하세요.
    </p>

    <a class="download" href="1234.usdz">USDZ 파일 직접 열기</a>
  </main>
</body>
</html>
