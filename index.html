<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Furniture AR Viewer</title>

  <style>
    :root{
      --bg:#f3f0ea;
      --card:#fff;
      --line:#ddd5c8;
      --text:#161616;
      --muted:#706a63;
      --soft:#f8f5f0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .page{
      width:min(1180px,calc(100% - 28px));
      margin:auto;
      padding:20px 0 34px;
    }
    header{text-align:center;padding:0 10px 24px}
    h1{
      margin:0;
      font-size:clamp(28px,3.2vw,44px);
      font-weight:800;
    }
    .sub{
      margin:12px 0 0;
      color:var(--muted);
      font-size:clamp(14px,1.7vw,19px);
    }
    .card{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:28px;
      background:#fff;
      box-shadow:0 18px 55px rgba(70,55,35,.09);
    }
    .viewer{
      position:relative;
      height:clamp(500px,68vh,790px);
      background:
        radial-gradient(circle at 50% 80%,rgba(75,65,55,.12),transparent 22%),
        linear-gradient(#fff 0%,#fff 64%,#eee8df 100%);
    }
    #canvasHost{
      position:absolute;
      inset:0;
      overflow:hidden;
    }
    #canvasHost canvas{
      display:block;
      width:100%;
      height:100%;
    }
    .loading{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      text-align:center;
      pointer-events:none;
      color:#6f6962;
      font-size:15px;
      z-index:3;
    }
    .loading.hidden{display:none}
    .loading b{
      display:block;
      color:#222;
      font-size:19px;
      margin-bottom:8px;
    }
    .ar-btn{
      position:absolute;
      right:24px;
      bottom:22px;
      z-index:5;
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:15px 22px;
      border-radius:999px;
      background:#111;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      box-shadow:0 10px 25px rgba(0,0,0,.22);
    }
    .hint{
      position:absolute;
      left:22px;
      bottom:22px;
      z-index:4;
      padding:10px 13px;
      border-radius:999px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(0,0,0,.08);
      color:#6e675f;
      font-size:13px;
    }
    .info{
      padding:28px 26px 26px;
      border-top:1px solid #eee7dc;
    }
    .info h2{margin:0 0 12px;font-size:25px}
    .info p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
    .steps{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-top:22px;
    }
    .step{
      min-height:82px;
      padding:17px 16px;
      background:var(--soft);
      border:1px solid var(--line);
      border-radius:18px;
    }
    .step b{display:block;margin-bottom:10px}
    .step span{font-size:15px}
    footer{text-align:center;color:#8c857d;font-size:14px;margin-top:48px}
    @media(max-width:720px){
      .page{width:calc(100% - 18px);padding-top:16px}
      header{padding-bottom:18px}
      .card{border-radius:22px}
      .viewer{height:58vh;min-height:460px}
      .steps{grid-template-columns:1fr 1fr}
      .ar-btn{right:14px;bottom:14px}
      .hint{left:14px;bottom:14px}
      .info{padding:22px 18px}
    }
    @media(max-width:460px){
      .steps{grid-template-columns:1fr}
      .hint{display:none}
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
<main class="page">
  <header>
    <h1>Furniture AR Viewer</h1>
    <p class="sub">웹에서 맵핑된 3D 모델을 확인하고, AR 버튼을 눌러 실제 공간에 배치해보세요.</p>
  </header>

  <section class="card">
    <div class="viewer">
      <div id="canvasHost"></div>

      <div id="loading" class="loading">
        <div>
          <b>3D 모델 불러오는 중</b>
          USDZ 모델과 텍스처를 로딩하고 있습니다.
        </div>
      </div>

      <div class="hint">드래그: 회전 · 휠/핀치: 확대·축소</div>

      <a class="ar-btn" rel="ar" href="./1234.usdz">
        ◇ &nbsp; AR로 보기
      </a>
    </div>

    <div class="info">
      <h2>작품 AR 체험</h2>
      <p>웹과 AR 모두 동일한 USDZ 파일을 사용하므로 재질과 맵핑이 동일하게 표시됩니다.</p>

      <div class="steps">
        <div class="step"><b>01</b><span>QR코드 또는 링크 접속</span></div>
        <div class="step"><b>02</b><span>맵핑된 3D 작품 확인</span></div>
        <div class="step"><b>03</b><span>AR 버튼 선택</span></div>
        <div class="step"><b>04</b><span>실제 공간에 배치</span></div>
      </div>
    </div>
  </section>

  <footer>Graduation Furniture Design WebAR Sample</footer>
</main>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { USDZLoader } from 'three/addons/loaders/USDZLoader.js';

  const host = document.getElementById('canvasHost');
  const loading = document.getElementById('loading');

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    35,
    host.clientWidth / host.clientHeight,
    0.01,
    10000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  host.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.target.set(0,0,0);

  // Lighting for textured PBR materials
  const hemi = new THREE.HemisphereLight(0xffffff, 0x777777, 2.0);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xffffff, 3.0);
  key.position.set(4,7,5);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xffffff, 1.5);
  fill.position.set(-4,3,-3);
  scene.add(fill);

  // Soft ground shadow
  const groundMat = new THREE.ShadowMaterial({
    color: 0x000000,
    opacity: 0.13
  });
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    groundMat
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;

  const loader = new USDZLoader();
  loader.load(
    './1234.usdz',
    (model) => {
      scene.add(model);

      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          if (obj.material) {
            obj.material.needsUpdate = true;
          }
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Center model
      model.position.sub(center);

      const maxDim = Math.max(size.x, size.y, size.z);

      camera.near = Math.max(maxDim / 1000, 0.01);
      camera.far = maxDim * 100;
      camera.position.set(maxDim * 1.25, maxDim * 0.8, maxDim * 1.55);
      camera.updateProjectionMatrix();

      controls.target.set(0, 0, 0);
      controls.minDistance = maxDim * 0.35;
      controls.maxDistance = maxDim * 6;

      // Ground follows model bottom
      ground.position.y = -size.y/2 - maxDim*0.01;
      scene.add(ground);

      loading.classList.add('hidden');
    },
    undefined,
    (err) => {
      console.error(err);
      loading.innerHTML =
        '<div><b>모델을 불러오지 못했습니다.</b>Netlify의 HTTPS 주소에서 다시 확인해주세요.</div>';
    }
  );

  function resize(){
    const w = host.clientWidth;
    const h = host.clientHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }
  window.addEventListener('resize', resize);

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
</script>
</body>
</html>
